# The base image adds this step to ovs-vswitchd.service (no-rmmod-bridge.conf):
#   ExecStartPre=/bin/sh -c "test -e /sys/module/openvswitch || exec modprobe openvswitch"
# A guest kernel with Open vSwitch built in has no /sys/module/openvswitch and no module file,
# so the step fails there. An empty ExecStartPre= line clears the list. The new step accepts a
# loaded module, a built in datapath, or a module that modprobe can load.
[Service]
ExecStartPre=
ExecStartPre=/usr/local/lib/podvm/ovs-datapath-check
