# Extra RuntimeClass objects for the memory overhead test of the Kata Rust runtime.
# Each one has the handler, the CPU overhead and the node selector of the stock object
# kata-clh-runtime-rs (kata-deploy 4.4.0). Only the memory overhead is different.
# A RuntimeClass is a Kubernetes object that names a handler, so these objects change
# no Kata file and need no containerd restart. The kubelet adds the memory overhead to
# the memory limit of the pod cgroup. The Kata runtime does not read it.
# Remove them with: kubectl delete runtimeclass -l lab=gate1-nvke-overhead
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-clh-runtime-rs-ovh192
  labels: {lab: gate1-nvke-overhead}
handler: kata-clh-runtime-rs
overhead:
  podFixed: {cpu: 250m, memory: 192Mi}
scheduling:
  nodeSelector:
    kata-deploy.katacontainers.io/default: "true"
    katacontainers.io/kata-runtime: "true"
---
