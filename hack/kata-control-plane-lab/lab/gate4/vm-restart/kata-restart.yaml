# Lima VM for the machine restart test of gate 4 (name: kata-restart).
# Make:   LIMA_HOME=/scratch/kata-cp/lima limactl create --name kata-restart --tty=false kata-restart.yaml
# Remove: LIMA_HOME=/scratch/kata-cp/lima limactl delete --force kata-restart
minimumLimaVersion: 2.0.0

vmType: qemu
arch: x86_64

# Ubuntu 26.04 LTS server cloud image (generic kernel). The same release as the lab host.
images:
  - location: "https://cloud-images.ubuntu.com/releases/resolute/release-20261016/ubuntu-26.04-server-cloudimg-amd64.img"
    arch: "x86_64"
    digest: "sha256:5645d0318ad21f643ebb1ac4567514620e9893380b07b0201fda163baa5b7eb5"

cpus: 8
memory: "16GiB"
disk: "60GiB"

# The CPU of the host with its VMX flag, so that the guest has /dev/kvm (nested KVM).
vmOpts:
  qemu:
    cpuType:
      x86_64: "host"

# Lima NICs must not block systemd-networkd-wait-online on 26.04 (from the Lima template ubuntu-26.04).
param:
  internal_netplanOptional: "true"

# Only one mount, for file transfer. No mount of the home directory.
mounts:
  - location: "/scratch/kata-cp/vm-share"
    writable: true
mountType: "9p"

ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
  forwardX11: false

# No containerd and no nerdctl from Lima.
containerd:
  system: false
  user: false

upgradePackages: false

video:
  display: "none"

# User-mode networking only (the Lima default). No other network.
networks: []

# No port forward from the guest to the host. This rule matches each guest address and each
# port, and it comes before the fallback rule of Lima. The SSH forward stays (Lima needs it).
portForwards:
  - guestIP: "0.0.0.0"
    guestIPMustBeZero: false
    guestPortRange: [1, 65535]
    proto: any
    ignore: true
