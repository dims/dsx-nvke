# Socket diagnostics with socket destroy, for a Kata guest that runs the NVKE agent
# (lab: an NVKE control plane node in a Kata pod, phase 2 gaps). The NVKE agent closes the
# established sockets of remote clients with "ss -K". That is the SOCK_DESTROY request of the
# inet_diag interface. The stock Kata guest kernel has no INET_DIAG, so "ss -K" lists the socket,
# ends with exit code 0 and closes nothing. All built in: the Kata guest kernel has no modules.
# A second fragment beside ovs.conf. ovs.conf has no change.
CONFIG_INET_DIAG=y
CONFIG_INET_TCP_DIAG=y
CONFIG_INET_DIAG_DESTROY=y
