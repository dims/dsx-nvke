# A plain pod with a QEMU class and no volume at all. It shows that the QEMU classes fail in this
# lab for a reason that is not the socket volume.
apiVersion: v1
kind: Pod
metadata:
  name: qemu-plain
  namespace: gate3
spec:
  runtimeClassName: kata-qemu
  automountServiceAccountToken: false
  enableServiceLinks: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 2
  containers:
    - name: test
      image: registry.k8s.io/e2e-test-images/busybox:1.36.1-1
      imagePullPolicy: IfNotPresent
      command: ["/bin/sleep", "infinity"]
      resources:
        limits: {cpu: "1", memory: 512Mi}
