# RuntimeClasses of the lab for the Kata guest image with the patched kata-agent
# (-fix) and for direct I/O to block volumes (-direct).
# Memory overhead 512Mi: the stock value of 130Mi is too small for an 8Gi guest
# (~/notes/hosted/lab/gate1-nvke/report-overhead.md). CPU overhead and node
# selector are those of the stock kata-clh classes.
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-clh-runtime-rs-fix
  labels: {lab.kata-fix: "true"}
handler: kata-clh-runtime-rs-fix
overhead: {podFixed: {cpu: 250m, memory: 512Mi}}
scheduling: {nodeSelector: {katacontainers.io/kata-runtime: "true"}}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-clh-fix
  labels: {lab.kata-fix: "true"}
handler: kata-clh-fix
overhead: {podFixed: {cpu: 250m, memory: 512Mi}}
scheduling: {nodeSelector: {katacontainers.io/kata-runtime: "true"}}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-clh-runtime-rs-direct
  labels: {lab.kata-fix: "true"}
handler: kata-clh-runtime-rs-direct
overhead: {podFixed: {cpu: 250m, memory: 512Mi}}
scheduling: {nodeSelector: {katacontainers.io/kata-runtime: "true"}}
---
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: kata-clh-runtime-rs-fix-direct
  labels: {lab.kata-fix: "true"}
handler: kata-clh-runtime-rs-fix-direct
overhead: {podFixed: {cpu: 250m, memory: 512Mi}}
scheduling: {nodeSelector: {katacontainers.io/kata-runtime: "true"}}
