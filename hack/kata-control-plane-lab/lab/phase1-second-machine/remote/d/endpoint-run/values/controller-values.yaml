# Values for the controller chart of the NVKE source: controller/deploy/charts/controller.
# Base: cli/internal/bootstrap/controllerdeploy/manifests/controller-values.yaml at bcc4376f,
# plus the values that nvkectl passes as flags (controllerdeploy.go:724-748), plus the
# settings of the phase 1 design. Each lab setting has the mark "phase 1".
# The database password comes from secrets/controller-secret-values.yaml (appDb.postgresPassword).

fullnameOverride: nvke-controller
nameOverride: nvke-controller
namespaceOverride: nvke-controller
serviceAccount:
  name: nvke-controller

# phase 1 step 7: the image of the branch feat/control-plane-endpoint (c6d669ef). It is in the kind node.
image:
  repository: docker.io/library/nvke-controller
  tag: c6d669ef
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []

metrics:
  networkPolicy:
    enabled: false
serviceMonitor:
  enabled: false

livenessProbe:
  httpGet:
    path: /healthz
    port: http
  initialDelaySeconds: 15
  periodSeconds: 20
readinessProbe:
  httpGet:
    path: /readyz
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10

appDb:
  url: postgres-postgresql.postgres.svc.cluster.local:5432
  dbName: nvke-controller
  postgresUser: postgres
  sslMode: disable

secrets:
  # The chart puts the database URL into a Secret (controllerdeploy.go:729-732).
  createDbSecret: true
  dgxcTenantCredSecretName: ""

temporal:
  host: temporal-frontend.temporal.svc.cluster.local
  port: 7233

# The empty /profiles of the controller image. It is enough for hosts that exist
# (controllerdeploy.go:261-265).
profiles:
  path: /profiles

# No CAPNICo in the lab. With true the controller exits when the NicoMachine kind is absent
# (controller/cmd/worker/main.go:389-395).
controllers:
  nico:
    enabled: false

# The API stays inside the cluster. No NodePort and no host port.
service:
  type: ClusterIP
  port: 8080
  nodePort: ""

# phase 1: the API accepts the generic provider block "infra" (controller/internal/server/clusters.go:396-398).
supportedInfraProviders: "infra"

# phase 1 step 7: back to the default. A control plane with 3 nodes needs controlPlaneVIP or controlPlaneEndpoint.
allowControlPlaneWithoutVIP: false

# phase 1: the agent installs the CNI after kubeadm init, from the package in the node image.
cni:
  installAfterInit: true

# phase 1: the Kata guest has no TPM. NVKE makes one SPIRE join token for each node.
nodeAgent:
  spireAttestationMethod: joinToken

spiffe:
  enabled: true
  # Must be the same as global.spire.trustDomain in spire-values.yaml.
  trustDomain: kata-cp.nvke.local
  spire:
    serverNamespace: spire-server
    className: spire-mgmt-spire
    # phase 1: what NVKE writes into agent.conf of each node. The address of the kind node and
    # the NodePort of manifests/spire-server-external.yaml. A pod of the lab cluster reaches it,
    # and it is outside the pod and Service ranges of both clusters.
    serverAddress: "172.30.0.2"
    serverPort: "30081"
    joinTokenTTL: "1h"

# The plain admin kubeconfig for each cluster. No OIDC provider, no exec plugin in Cluster API.
nvkeOIDCAuth:
  enabled: false

# No token for /api. Each pod of the lab cluster can call the API. Lab only.
apiAuth:
  enabled: false

# RBAC for the Cluster API kinds and for the kinds of the provisioned provider
# (templates/rbac-capi.yaml).
capi:
  enabled: true
  rbac:
    create: true

env:
  # The default of the controller, written here so that it is visible
  # (controller/internal/config/config.go:348).
  - name: SPIRE_SERVER_API_ADDRESS
    value: spire-server.spire-server.svc.cluster.local:8081
