# Open vSwitch kernel datapath with Geneve, for a Kata guest that runs OVN-Kubernetes as a node
# (lab: an NVKE control plane node in a Kata pod, phase 1 block C3). One added fragment, on top of
# the kernel build files of Kata 4.4.0. All built in: the stock Kata guest kernel has no modules.
CONFIG_OPENVSWITCH=y
CONFIG_OPENVSWITCH_GENEVE=y
CONFIG_OPENVSWITCH_VXLAN=y
CONFIG_GENEVE=y
# Open vSwitch selects these two. They are named here so that the config check lists them.
CONFIG_MPLS=y
CONFIG_NET_NSH=y
# Connection tracking and NAT for Open vSwitch (the ct and nat actions that OVN uses).
# The stock kernel has NF_CONNTRACK, NF_CONNTRACK_ZONES, NF_CONNTRACK_LABELS, NF_CONNTRACK_MARK,
# NF_DEFRAG_IPV4, NF_DEFRAG_IPV6 and NF_NAT already. These two are the Open vSwitch parts.
CONFIG_NF_CONNTRACK_OVS=y
CONFIG_NF_NAT_OVS=y
