{{- if and .Values.capi.rbac.create .Values.capi.rbac.podvm }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "controller.fullname" . }}-podvm
  labels:
    {{- include "controller.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - infrastructure.cluster.x-k8s.io
    resources:
      - podvmclusters
      - podvmmachines
      - podvmmachinetemplates
    verbs:
      - create
      - delete
      - get
      - list
      - patch
      - watch
  - apiGroups:
      - apiextensions.k8s.io
    resources:
      - customresourcedefinitions
    resourceNames:
      - podvmclusters.infrastructure.cluster.x-k8s.io
      - podvmmachines.infrastructure.cluster.x-k8s.io
      - podvmmachinetemplates.infrastructure.cluster.x-k8s.io
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "controller.fullname" . }}-podvm
  labels:
    {{- include "controller.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "controller.fullname" . }}-podvm
subjects:
  - kind: ServiceAccount
    name: {{ include "controller.serviceAccountName" . }}
    namespace: {{ include "controller.namespace" . }}
{{- end }}
