# Values for the kata-deploy chart of Kata Containers 4.4.0, for the kind host
# cluster of cluster-api-provider-podvm. up.sh installs the chart with them.
#
# One custom runtime, kata-podvm, on the Cloud Hypervisor configuration of the
# Rust runtime. It has what cluster-api-provider-podvm/node-image/README.md
# asks of Kata: the guest kernel and the guest image that the reader builds,
# direct I/O for block volumes, and a larger memory overhead.
#
# Kata has that configuration for amd64 only. On arm64 up.sh adds
# kata-deploy-values-arm64.yaml, which puts the runtime on QEMU.
k8sDistribution: k8s
shims:
  disableAll: true
  clh-runtime-rs:
    enabled: true
# The default shim of the chart is a QEMU shim, and the installer refuses a
# default that is not one of the shims above.
defaultShim:
  amd64: clh-runtime-rs
customRuntimes:
  enabled: true
  runtimes:
    podvm:
      baseConfig: clh-runtime-rs
      # up.sh copies the two files to these paths in each kind node.
      dropIn: |
        [hypervisor.clh]
        kernel = "/opt/kata-podvm/vmlinux"
        image = "/opt/kata-podvm/kata-containers.img"
        block_device_cache_direct = true
      runtimeClass: |
        kind: RuntimeClass
        apiVersion: node.k8s.io/v1
        metadata:
          name: kata-podvm
          labels:
            app.kubernetes.io/managed-by: kata-deploy
        handler: kata-podvm
        overhead:
          podFixed:
            memory: "512Mi"
            cpu: "250m"
        scheduling:
          nodeSelector:
            katacontainers.io/kata-runtime: "true"
