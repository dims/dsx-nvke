# The kind host cluster for cluster-api-provider-podvm. up.sh creates it.
#
# Three workers, because the provider makes one failure domain of each host
# node that a pod can run on, and a control plane has three nodes. The control
# plane node of the host cluster has a NoSchedule taint, so it is in no failure
# domain.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # MetalLB in layer 2 mode needs kube-proxy to answer for the address of a
  # Service on a node. The iptables mode is the one this was tried with.
  kubeProxyMode: iptables
nodes:
  # The tag of KINDEST_NODE_TAG in hack/capd-kindest-node/Dockerfile, so the
  # host cluster and the nodes of a tenant cluster have one version.
  - role: control-plane
    image: kindest/node:v1.36.4
  - role: worker
    image: kindest/node:v1.36.4
  - role: worker
    image: kindest/node:v1.36.4
  - role: worker
    image: kindest/node:v1.36.4
