---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  labels:
    cluster.x-k8s.io/provider: infrastructure-podvm
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: podvmmachines.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: PodVMMachine
    listKind: PodVMMachineList
    plural: podvmmachines
    shortNames:
    - pvmm
    singular: podvmmachine
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.initialization.provisioned
      name: Provisioned
      type: boolean
    - jsonPath: .status.podName
      name: Pod
      type: string
    - jsonPath: .status.address
      name: Address
      type: string
    - jsonPath: .spec.providerID
      name: ProviderID
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: PodVMMachine is the Schema for the podvmmachines API.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PodVMMachineSpec defines the desired state of PodVMMachine.
            properties:
              image:
                description: |-
                  Image is the node image for pods. The entry point of the image runs:
                  the provider sets no command and no arguments. The image carries the
                  Kubernetes version of the node, so a new version is a new image.
                maxLength: 1024
                minLength: 1
                type: string
              imagePullPolicy:
                description: |-
                  ImagePullPolicy is the pull policy of the node image. When it is empty,
                  the host cluster applies its default.
                enum:
                - Always
                - IfNotPresent
                - Never
                type: string
              providerID:
                description: |-
                  ProviderID names the pod of this machine, in the form
                  podvm://<pod-namespace>/<pod-name>. The provider sets it once, when the
                  pod runs for the first time. The provider never changes it and never
                  clears it: a new pod for the same machine has the same name.
                maxLength: 512
                minLength: 1
                type: string
              resources:
                description: Resources is the size of the virtual machine.
                properties:
                  cpu:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      CPU is the CPU count of the virtual machine. The provider writes it as
                      the limit and as the request of the container, because the Kata runtime
                      sizes the virtual machine from the limits.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: |-
                      Memory is the memory of the virtual machine. The provider writes it as
                      the limit and as the request of the container.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                required:
                - cpu
                - memory
                type: object
              volumes:
                description: Volumes describes the two block volumes of the pod.
                properties:
                  etcd:
                    description: Etcd is the volume that the node image mounts at
                      /var/lib/etcd.
                    properties:
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        description: Size is the size that the volume claim requests.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        description: |-
                          StorageClassName is the storage class of the volume claim. When it is
                          empty, the claim names no class and the host cluster uses its default
                          class.
                        maxLength: 253
                        type: string
                    required:
                    - size
                    type: object
                  var:
                    description: |-
                      Var is the volume that the node image mounts at /var. It keeps the
                      state of the node through a new pod, with the SPIRE agent data.
                    properties:
                      size:
                        anyOf:
                        - type: integer
                        - type: string
                        description: Size is the size that the volume claim requests.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                      storageClassName:
                        description: |-
                          StorageClassName is the storage class of the volume claim. When it is
                          empty, the claim names no class and the host cluster uses its default
                          class.
                        maxLength: 253
                        type: string
                    required:
                    - size
                    type: object
                required:
                - etcd
                - var
                type: object
            required:
            - image
            - resources
            - volumes
            type: object
            x-kubernetes-validations:
            - message: providerID is immutable once set
              rule: '!has(oldSelf.providerID) || (has(self.providerID) && self.providerID
                == oldSelf.providerID)'
          status:
            description: PodVMMachineStatus defines the observed state of PodVMMachine.
            properties:
              address:
                description: |-
                  Address is the fixed address that this machine holds, with no prefix
                  length. This field is the record of the allocation: the provider
                  derives the set of used addresses from this field of every machine of
                  the cluster. The address is free again when the PodVMMachine is gone.
                type: string
              addresses:
                description: |-
                  Addresses holds the fixed address of the machine as its internal IP
                  address. The provider writes it before the pod exists. Cluster API
                  copies it to the Machine, and the NVKE controller reads it to find the
                  node agent.
                items:
                  description: MachineAddress contains information for the node's
                    address.
                  properties:
                    address:
                      description: address is the machine address.
                      maxLength: 256
                      minLength: 1
                      type: string
                    type:
                      description: type is the machine address type, one of Hostname,
                        ExternalIP, InternalIP, ExternalDNS or InternalDNS.
                      enum:
                      - Hostname
                      - ExternalIP
                      - InternalIP
                      - ExternalDNS
                      - InternalDNS
                      type: string
                  required:
                  - address
                  - type
                  type: object
                type: array
              conditions:
                description: Conditions describes the current state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
              hardwareAddress:
                description: |-
                  HardwareAddress is the fixed hardware address of the pod interface on
                  the node network. The provider derives it from the address.
                type: string
              initialization:
                description: Initialization reports the state that the Cluster API
                  contract requires.
                minProperties: 1
                properties:
                  provisioned:
                    description: |-
                      Provisioned is true when the pod of the machine ran for the first time.
                      The provider never clears it: a pod that is lost later is made again
                      for the same machine.
                    type: boolean
                type: object
              lastRebootRequest:
                description: |-
                  LastRebootRequest is the value of the reboot annotation of the owner
                  Machine that the provider answered last. The provider answers a new
                  value one time: it deletes the pod, and then makes the pod again.
                type: string
              podName:
                description: PodName is the name of the pod. It is the name of the
                  owner Machine.
                type: string
              podNamespace:
                description: |-
                  PodNamespace is the namespace of the pod, of the volume claims and of
                  the copy of the bootstrap Secret. The provider records it before it
                  makes the first of them, so a delete finds them without the
                  PodVMCluster.
                type: string
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
