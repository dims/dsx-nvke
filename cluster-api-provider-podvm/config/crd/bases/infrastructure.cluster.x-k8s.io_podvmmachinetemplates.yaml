---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.20.1
  labels:
    cluster.x-k8s.io/provider: infrastructure-podvm
    cluster.x-k8s.io/v1beta2: v1alpha1
  name: podvmmachinetemplates.infrastructure.cluster.x-k8s.io
spec:
  group: infrastructure.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: PodVMMachineTemplate
    listKind: PodVMMachineTemplateList
    plural: podvmmachinetemplates
    shortNames:
    - pvmmt
    singular: podvmmachinetemplate
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          PodVMMachineTemplate is the Schema for the podvmmachinetemplates API.

          A caller sends this kind as the infra.machineTemplate of the cluster control
          plane configuration or of a node pool. The template carries the node image,
          the size of the virtual machine and the two volumes. The address of each
          machine comes from the PodVMCluster.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: PodVMMachineTemplateSpec defines the desired state of PodVMMachineTemplate.
            properties:
              template:
                description: Template is the machine to render.
                properties:
                  metadata:
                    description: |-
                      ObjectMeta is copied to the rendered machine. Only labels and annotations
                      are used.
                    type: object
                  spec:
                    description: Spec is the spec of the rendered PodVMMachine.
                    properties:
                      image:
                        description: |-
                          Image is the node image for pods. The entry point of the image runs:
                          the provider sets no command and no arguments. The image carries the
                          Kubernetes version of the node, so a new version is a new image.
                        maxLength: 1024
                        minLength: 1
                        type: string
                      imagePullPolicy:
                        description: |-
                          ImagePullPolicy is the pull policy of the node image. When it is empty,
                          the host cluster applies its default.
                        enum:
                        - Always
                        - IfNotPresent
                        - Never
                        type: string
                      providerID:
                        description: |-
                          ProviderID names the pod of this machine, in the form
                          podvm://<pod-namespace>/<pod-name>. The provider sets it once, when the
                          pod runs for the first time. The provider never changes it and never
                          clears it: a new pod for the same machine has the same name.
                        maxLength: 512
                        minLength: 1
                        type: string
                      resources:
                        description: Resources is the size of the virtual machine.
                        properties:
                          cpu:
                            anyOf:
                            - type: integer
                            - type: string
                            description: |-
                              CPU is the CPU count of the virtual machine. The provider writes it as
                              the limit and as the request of the container, because the Kata runtime
                              sizes the virtual machine from the limits.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          memory:
                            anyOf:
                            - type: integer
                            - type: string
                            description: |-
                              Memory is the memory of the virtual machine. The provider writes it as
                              the limit and as the request of the container.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                        required:
                        - cpu
                        - memory
                        type: object
                      volumes:
                        description: Volumes describes the two block volumes of the
                          pod.
                        properties:
                          etcd:
                            description: Etcd is the volume that the node image mounts
                              at /var/lib/etcd.
                            properties:
                              size:
                                anyOf:
                                - type: integer
                                - type: string
                                description: Size is the size that the volume claim
                                  requests.
                                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                x-kubernetes-int-or-string: true
                              storageClassName:
                                description: |-
                                  StorageClassName is the storage class of the volume claim. When it is
                                  empty, the claim names no class and the host cluster uses its default
                                  class.
                                maxLength: 253
                                type: string
                            required:
                            - size
                            type: object
                          var:
                            description: |-
                              Var is the volume that the node image mounts at /var. It keeps the
                              state of the node through a new pod, with the SPIRE agent data.
                            properties:
                              size:
                                anyOf:
                                - type: integer
                                - type: string
                                description: Size is the size that the volume claim
                                  requests.
                                pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                                x-kubernetes-int-or-string: true
                              storageClassName:
                                description: |-
                                  StorageClassName is the storage class of the volume claim. When it is
                                  empty, the claim names no class and the host cluster uses its default
                                  class.
                                maxLength: 253
                                type: string
                            required:
                            - size
                            type: object
                        required:
                        - etcd
                        - var
                        type: object
                    required:
                    - image
                    - resources
                    - volumes
                    type: object
                    x-kubernetes-validations:
                    - message: providerID is immutable once set
                      rule: '!has(oldSelf.providerID) || (has(self.providerID) &&
                        self.providerID == oldSelf.providerID)'
                required:
                - spec
                type: object
            required:
            - template
            type: object
        type: object
    served: true
    storage: true
    subresources: {}
