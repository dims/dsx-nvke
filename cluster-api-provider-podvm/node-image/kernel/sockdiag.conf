#
# Socket diagnostics with socket destroy, for a Kata guest that runs the NVKE
# node agent. The agent closes the open connections of remote clients with
# "ss -K", which is the SOCK_DESTROY request of the inet_diag interface. Without
# INET_DIAG "ss -K" lists the socket, ends with exit code 0 and closes nothing.
# A fragment for the guest kernel build of Kata Containers, built in.
CONFIG_INET_DIAG=y
CONFIG_INET_TCP_DIAG=y
CONFIG_INET_DIAG_DESTROY=y
