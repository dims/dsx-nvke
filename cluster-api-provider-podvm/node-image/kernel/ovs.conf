#
# Open vSwitch kernel datapath with Geneve, for a Kata guest that runs
# OVN-Kubernetes as a node. A fragment for the guest kernel build of Kata
# Containers. All built in: the stock Kata guest kernel has no modules.
CONFIG_OPENVSWITCH=y
CONFIG_OPENVSWITCH_GENEVE=y
CONFIG_OPENVSWITCH_VXLAN=y
CONFIG_GENEVE=y
# Open vSwitch selects these two. They are named here so that a config check lists them.
CONFIG_MPLS=y
CONFIG_NET_NSH=y
# Connection tracking and NAT for Open vSwitch (the ct and nat actions of OVN).
# The stock kernel has NF_CONNTRACK, NF_CONNTRACK_ZONES, NF_CONNTRACK_LABELS,
# NF_CONNTRACK_MARK, NF_DEFRAG_IPV4, NF_DEFRAG_IPV6 and NF_NAT already.
CONFIG_NF_CONNTRACK_OVS=y
CONFIG_NF_NAT_OVS=y
