# The start step of the base image (no-rmmod-bridge.conf) fails when the kernel
# has Open vSwitch built in: there is no /sys/module/openvswitch and no module
# file. The empty line clears that step, and the new step also accepts a built
# in datapath.
[Service]
ExecStartPre=
ExecStartPre=/usr/local/lib/podvm/ovs-datapath-check
