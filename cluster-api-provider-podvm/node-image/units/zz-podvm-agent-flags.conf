# The flags that this image gives the node agent. The bootstrap data replaces
# AGENT_ARGS, so the flags are set here.
#
# --disable-mlx5-rescan: at its start the node agent can remove the PCI devices
# of a DPU and scan the bus again. That is for a machine with no network
# interface but loopback, whose DPU was not up in time. A pod has its
# interfaces from the CNI before the agent starts, and no PCI device of a DPU.
#
# The other three flags are the health gate of the shared control plane
# endpoint. Before an operation that stops the API server or etcd of this node,
# the node agent makes the gate file. The readiness probe of the pod
# (podvm-endpoint-ready) reads it, so the Service of the endpoint stops new
# connections to this node. After the settle time the agent closes the open
# connections that arrived on the interface. The image build takes these three
# flags out when the node agent of the base image has no endpoint gate.
[Service]
Environment="PODVM_AGENT_FLAGS=--disable-mlx5-rescan --control-plane-endpoint-gate-file=/var/lib/nvke/control-plane-endpoint.gate --control-plane-endpoint-backend-interface=eth0 --control-plane-endpoint-gate-settle=15s"
ExecStartPre=/usr/bin/mkdir -p /var/lib/nvke
ExecStart=
ExecStart=/usr/local/bin/nvke-agent $AGENT_ARGS $PODVM_AGENT_FLAGS
