# The health gate of the shared control plane endpoint. Before an operation
# that stops the API server or etcd of this node, the node agent makes the gate
# file. The readiness probe of the pod (podvm-endpoint-ready) reads it, so the
# Service of the endpoint stops new connections to this node. After the settle
# time the agent closes the open connections that arrived on the interface.
# The bootstrap data replaces AGENT_ARGS, so the flags are set here.
[Service]
Environment="PODVM_AGENT_GATE_FLAGS=--control-plane-endpoint-gate-file=/var/lib/nvke/control-plane-endpoint.gate --control-plane-endpoint-backend-interface=eth0 --control-plane-endpoint-gate-settle=15s"
ExecStartPre=/usr/bin/mkdir -p /var/lib/nvke
ExecStart=
ExecStart=/usr/local/bin/nvke-agent $AGENT_ARGS $PODVM_AGENT_GATE_FLAGS
